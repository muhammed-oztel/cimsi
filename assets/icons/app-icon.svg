<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#161d2c"/>
      <stop offset="1" stop-color="#0e1119"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9c96b"/>
      <stop offset="1" stop-color="#b4903a"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="48" fill="url(#bg)"/>
  <rect x="0" y="0" width="256" height="256" rx="48" fill="none" stroke="#2c3650" stroke-width="4"/>

  <!-- SIM card body -->
  <g>
    <path d="M60 40 H160 L196 76 V208 A12 12 0 0 1 184 220 H72 A12 12 0 0 1 60 208 Z"
          fill="#1b2436" stroke="#3a4a6b" stroke-width="4"/>
    <path d="M160 40 V64 A12 12 0 0 0 172 76 H196 Z" fill="#243050"/>

    <!-- gold contact chip -->
    <rect x="82" y="96" width="72" height="56" rx="8" fill="url(#chip)"/>
    <g stroke="#7a5f22" stroke-width="2">
      <line x1="82" y1="112" x2="154" y2="112"/>
      <line x1="82" y1="128" x2="154" y2="128"/>
      <line x1="82" y1="144" x2="154" y2="144"/>
      <line x1="106" y1="96" x2="106" y2="152"/>
      <line x1="130" y1="96" x2="130" y2="152"/>
    </g>
  </g>

  <!-- hash / brute-force digit streaks peeling off the corner -->
  <g fill="none" stroke="#49c2d9" stroke-width="5" stroke-linecap="round" opacity="0.95">
    <path d="M196 96 L228 88"/>
    <path d="M198 116 L232 112"/>
    <path d="M196 136 L226 140"/>
  </g>
  <g fill="#6fd6ea" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">
    <text x="196" y="70">A1</text>
    <text x="198" y="176">F3</text>
    <text x="176" y="196" fill="#49c2d9" font-size="13">*7*</text>
  </g>

  <!-- magnifier / crack accent over the chip -->
  <circle cx="118" cy="124" r="30" fill="none" stroke="#e0555a" stroke-width="0" opacity="0"/>
</svg>
