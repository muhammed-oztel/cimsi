name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release exe
        run: cargo build --release --locked

      - name: Stage exe
        run: |
          mkdir dist
          copy target\release\cimsi.exe dist\cimsi-windows-x64.exe
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: cimsi-windows-x64
          path: dist\cimsi-windows-x64.exe

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cimsi-windows-x64
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/cimsi-windows-x64.exe
          generate_release_notes: true
